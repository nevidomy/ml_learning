[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainui"
version = "0.1.0"
description = "Local training-metric tracking: python client, SQLite storage, web UI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
]

[tool.setuptools]
packages = ["trainui"]
package-dir = { "trainui" = "." }

[tool.setuptools.package-data]
trainui = ["static/*"]
